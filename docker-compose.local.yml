name: web-check-local

services:
  web-check:
    image: ${WEB_CHECK_IMAGE:-lissy93/web-check:latest}
    ports:
      - "127.0.0.1:${WEB_CHECK_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      ENABLE_ANALYTICS: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
